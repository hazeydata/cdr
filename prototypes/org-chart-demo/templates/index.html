<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Organizational Chart — CDR Demo</title>
    <style>
        :root {
            --gc-blue: #26374a;
            --gc-red: #af3c43;
            --gc-white: #ffffff;
            --gc-light-grey: #f5f5f5;
            --gc-border: #dcdee1;
            --gc-text: #333333;
            --gc-link: #2b4380;
            --gc-focus: #ffbf47;
            --radius: 6px;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--gc-light-grey);
            color: var(--gc-text);
            line-height: 1.6;
        }
        a:focus, button:focus, input:focus {
            outline: 3px solid var(--gc-focus);
            outline-offset: 2px;
        }
        header {
            background: var(--gc-blue);
            color: var(--gc-white);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        header h1 { margin: 0; font-size: 1.4rem; font-weight: 600; }
        header .subtitle { font-size: 0.85rem; opacity: 0.85; }
        .lang-toggle {
            background: transparent;
            color: var(--gc-white);
            border: 1px solid var(--gc-white);
            padding: 0.35rem 1rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.9rem;
        }
        .lang-toggle:hover { background: rgba(255,255,255,0.15); }
        .demo-banner {
            background: #fff3cd;
            border-bottom: 2px solid #ffc107;
            padding: 0.6rem 2rem;
            font-size: 0.85rem;
            color: #664d03;
        }
        .controls {
            padding: 1rem 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .controls input[type="search"] {
            flex: 1;
            min-width: 200px;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--gc-border);
            border-radius: var(--radius);
            font-size: 0.95rem;
        }
        .controls button {
            background: var(--gc-blue);
            color: var(--gc-white);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.85rem;
        }
        .controls button:hover { opacity: 0.9; }
        main { padding: 0 2rem 2rem; }
        .org-tree { list-style: none; padding-left: 0; }
        .org-tree ul { list-style: none; padding-left: 1.5rem; border-left: 2px solid var(--gc-border); margin: 0; }
        .org-node {
            margin: 0.4rem 0;
        }
        .node-card {
            background: var(--gc-white);
            border: 1px solid var(--gc-border);
            border-radius: var(--radius);
            padding: 0.6rem 1rem;
            display: inline-block;
            max-width: 100%;
            transition: box-shadow 0.15s;
        }
        .node-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .node-card .name { font-weight: 600; color: var(--gc-blue); }
        .node-card .title { font-size: 0.9rem; }
        .node-card .meta { font-size: 0.8rem; color: #666; margin-top: 0.2rem; }
        .toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--gc-link);
            padding: 0 0.3rem;
            margin-right: 0.3rem;
        }
        .collapsed > ul { display: none; }
        .collapsed > .org-node-content > .toggle-btn::before { content: "▶ "; }
        .expanded > .org-node-content > .toggle-btn::before { content: "▼ "; }
        .hidden { display: none; }
        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.8rem;
            color: #666;
            border-top: 1px solid var(--gc-border);
            margin-top: 2rem;
        }
        @media (max-width: 600px) {
            header { padding: 0.75rem 1rem; }
            .controls { padding: 0.75rem 1rem; }
            main { padding: 0 1rem 1rem; }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1 id="header-title">Organizational Chart</h1>
            <div class="subtitle" id="header-subtitle">Demo — Synthetic Data (Not Real)</div>
        </div>
        <button class="lang-toggle" id="lang-toggle" aria-label="Switch language">Français</button>
    </header>
    <div class="demo-banner" id="demo-banner" role="alert">
        DEMO — This org-chart uses synthetic data. No real employee information is displayed.
    </div>
    <div class="controls">
        <input type="search" id="search-input" placeholder="Search departments or positions..." aria-label="Search departments or positions">
        <button id="expand-btn">Expand All</button>
        <button id="collapse-btn">Collapse All</button>
    </div>
    <main>
        <ul class="org-tree" id="org-tree" role="tree" aria-label="Organizational chart"></ul>
    </main>
    <footer id="footer">Canadian Digital Railway — Phase 0 Prototype</footer>

    <script>
    // ORG_DATA and STRINGS are injected by the Python server
    const orgData = /*ORG_DATA*/null;
    const strings = /*STRINGS*/null;

    let currentLang = "en";

    function renderNode(node, parentUl) {
        const li = document.createElement("li");
        li.classList.add("org-node", "expanded");
        li.setAttribute("role", "treeitem");
        li.setAttribute("aria-expanded", "true");

        const content = document.createElement("div");
        content.classList.add("org-node-content");

        const hasChildren = node.children && node.children.length > 0;

        if (hasChildren) {
            const toggleBtn = document.createElement("button");
            toggleBtn.classList.add("toggle-btn");
            toggleBtn.setAttribute("aria-label", "Toggle children");
            toggleBtn.addEventListener("click", function() {
                const isExpanded = li.classList.contains("expanded");
                li.classList.toggle("expanded", !isExpanded);
                li.classList.toggle("collapsed", isExpanded);
                li.setAttribute("aria-expanded", String(!isExpanded));
            });
            content.appendChild(toggleBtn);
        }

        const card = document.createElement("div");
        card.classList.add("node-card");

        const nameEl = document.createElement("div");
        nameEl.classList.add("name");
        nameEl.textContent = node.name;

        const titleEl = document.createElement("div");
        titleEl.classList.add("title");
        titleEl.setAttribute("data-en", node.title_en);
        titleEl.setAttribute("data-fr", node.title_fr);
        titleEl.textContent = currentLang === "en" ? node.title_en : node.title_fr;

        const metaEl = document.createElement("div");
        metaEl.classList.add("meta");
        const deptLabel = currentLang === "en" ? node.department_en : node.department_fr;
        metaEl.setAttribute("data-dept-en", node.department_en);
        metaEl.setAttribute("data-dept-fr", node.department_fr);
        metaEl.textContent = `${deptLabel} · ${node.grade} · ${node.location}`;

        card.appendChild(nameEl);
        card.appendChild(titleEl);
        card.appendChild(metaEl);
        content.appendChild(card);
        li.appendChild(content);

        if (hasChildren) {
            const childUl = document.createElement("ul");
            childUl.setAttribute("role", "group");
            node.children.forEach(function(child) {
                renderNode(child, childUl);
            });
            li.appendChild(childUl);
        }

        parentUl.appendChild(li);
    }

    function renderTree() {
        const tree = document.getElementById("org-tree");
        tree.innerHTML = "";
        if (orgData) {
            renderNode(orgData, tree);
        }
    }

    function updateLanguage() {
        const s = strings[currentLang];
        document.getElementById("header-title").textContent = s.title;
        document.getElementById("header-subtitle").textContent = s.subtitle;
        document.getElementById("lang-toggle").textContent = s.language_toggle;
        document.getElementById("demo-banner").textContent = s.demo_notice;
        document.getElementById("search-input").placeholder = s.search_placeholder;
        document.getElementById("expand-btn").textContent = s.expand_all;
        document.getElementById("collapse-btn").textContent = s.collapse_all;
        document.getElementById("footer").textContent = s.footer;
        document.getElementById("page-title").textContent = s.title + " — CDR Demo";
        document.documentElement.lang = currentLang === "en" ? "en" : "fr";

        document.querySelectorAll(".node-card .title").forEach(function(el) {
            el.textContent = el.getAttribute("data-" + currentLang);
        });
        document.querySelectorAll(".node-card .meta").forEach(function(el) {
            const dept = el.getAttribute("data-dept-" + currentLang);
            const parts = el.textContent.split(" · ");
            if (parts.length >= 3) {
                el.textContent = dept + " · " + parts[1] + " · " + parts[2];
            }
        });
    }

    document.getElementById("lang-toggle").addEventListener("click", function() {
        currentLang = currentLang === "en" ? "fr" : "en";
        updateLanguage();
    });

    document.getElementById("expand-btn").addEventListener("click", function() {
        document.querySelectorAll(".org-node").forEach(function(n) {
            n.classList.remove("collapsed");
            n.classList.add("expanded");
            n.setAttribute("aria-expanded", "true");
        });
    });

    document.getElementById("collapse-btn").addEventListener("click", function() {
        document.querySelectorAll(".org-node").forEach(function(n) {
            if (n.querySelector("ul")) {
                n.classList.remove("expanded");
                n.classList.add("collapsed");
                n.setAttribute("aria-expanded", "false");
            }
        });
    });

    document.getElementById("search-input").addEventListener("input", function(e) {
        const query = e.target.value.toLowerCase().trim();
        document.querySelectorAll(".org-node").forEach(function(n) {
            const card = n.querySelector(".node-card");
            if (!card) return;
            const text = card.textContent.toLowerCase();
            if (!query || text.includes(query)) {
                n.classList.remove("hidden");
            } else {
                const hasVisibleChild = n.querySelector(".org-node:not(.hidden)");
                if (hasVisibleChild) {
                    n.classList.remove("hidden");
                } else {
                    n.classList.add("hidden");
                }
            }
        });
        if (query) {
            document.querySelectorAll(".org-node.hidden").forEach(function(n) {
                let parent = n.parentElement;
                while (parent && parent.id !== "org-tree") {
                    if (parent.classList.contains("org-node")) {
                        parent.classList.remove("hidden");
                    }
                    parent = parent.parentElement;
                }
            });
        }
    });

    renderTree();
    </script>
</body>
</html>
